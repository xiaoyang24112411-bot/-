[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-nonebot-starter"
version = "0.1.0"
description = "A modular QQ bot starter based on NoneBot2 and OneBot V11"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.4.4,<3.0.0",
    "nonebot-adapter-onebot>=2.4.6,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "nonebot-plugin-petpet==0.3.21",
    "Pillow==9.5.0",
    "playwright>=1.55.0,<2.0.0",
    "yt-dlp>=2026.8.19",
    "edge-tts>=7.2.7,<8.0.0",
    "jieba>=0.42.1,<1.0.0",
    "wordcloud>=1.9.4,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []
plugins = ["nonebot_plugin_petpet"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["work/pillow10-test"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
